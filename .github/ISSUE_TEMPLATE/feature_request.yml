name: Feature Request
description: Propose a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered

  - type: dropdown
    id: category
    attributes:
      label: Component
      options:
        - Agent Runtime
        - Tool Execution
        - TUI
        - LLM Provider
        - Context Management
        - Memory Management
        - Configuration
        - Performance
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
